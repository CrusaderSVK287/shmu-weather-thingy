[package]
name = "shmu-weather-thingy"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
directories = "6.0.0"
env_logger = "0.11.11"
log = "0.4.33"
notify-rust = "4.18.0"
ntfy = { version = "0.9", default-features = false, features = ["blocking", "rustls"] }
reqwest = "0.13.4"
scraper = "0.27.0"
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
toml = "1.1.2"
winrt-notification = "0.5.1"
xml = "1.3.0"
